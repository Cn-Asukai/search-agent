# ══════════════════════════════════════════════════════════
# websearch-mcpserver 容器化配置
# 本文件是根目录 websearch.config.yaml 的容器化副本,请与根目录保持一致。
# 与根目录仅两处差异(容器环境所需):
#   1. host: "0.0.0.0"     —— 容器内需跨网络监听,供 agent 容器访问
#   2. cache.storage_path  —— 根目录是 Windows 路径(D:/...),容器内需用 Linux 路径
# 修改功能开关时请同步两份文件。
# ══════════════════════════════════════════════════════════

# MCP HTTP 服务监听端口(与根目录一致)
port: 8338

# 监听地址:容器内必须监听所有网卡,agent 容器才能通过 compose 网络访问
host: "0.0.0.0"

# 业务端点鉴权 token(可选,默认空 = 不鉴权)。
# 容器内 agent 通过 compose 内网访问,可不开;若开启需在 docker-compose 中
# 设置环境变量 WEBSEARCH_TOKEN 并同步 opencode.jsonc 的 headers。
# 环境变量: WEBSEARCH_TOKEN
# auth_token: ""

# 日志级别: debug / info / warn / error
log_level: info

# 搜索模式:engine = 百度网页搜索 + Bing + DuckDuckGo(无需 API Key)
mode: engine

# 网络环境: china(自动跳过海外引擎) / international
network: china

# 屏蔽站点列表(对所有搜索引擎生效)
black_list_host:
  - "baijiahao.baidu.com"
  - "csdn.net"
  - "csdn.com"
  - "gitcode.com"
  - "gitcode.net"
  - "baidu.com"
  - "weibo.com"
  - "sina.com.cn"

# 全局限流(对所有搜索引擎统一生效)
rate_limit:
  per_sec: 3   # 每秒请求数上限
  per_min: 60  # 每分钟请求数上限

# Bing 通用搜索引擎(engine 模式主力引擎,无需 API Key)
bing:
  enabled: true
  blocked: []

# DuckDuckGo(需代理才能访问;容器内默认禁用代理,故实际不参与)
duckduckgo:
  enabled: true
  blocked: []

# Google(被反爬拦截,默认禁用)
google:
  enabled: false
  blocked: []

# 学术搜索引擎(无需 API Key;跨容器代理默认关闭,海外引擎基本不可访问)
academic:
  enabled: true
  bing_fallback: false
  enhance: true
  threshold: 0.02
  disable_arxiv: false
  disable_crossref: false
  disable_openalex: false
  disable_pubmed: false
  disable_semantic_scholar: true
  disable_google_scholar: true
  # 国内可直连的三个增补引擎
  disable_europepmc: false
  disable_dblp: false
  disable_doaj: false

# 代理:容器内显式禁用(自动检测在容器内无意义;如需走代理改 compose 加网络)
proxy:
  enabled: false
  endpoint: "http://127.0.0.1:7897"

# 缓存(挂载为命名卷 /var/lib/websearch,见 docker-compose.yml)
cache:
  storage_path: "/var/lib/websearch/search_cache.db"
  cleanup_interval: 30

# 日志文件滚动
log:
  max_size: 1
  max_age: 1
