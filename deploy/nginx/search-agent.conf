# search-agent 服务片段（server 上下文）
#
# 只描述本服务：静态 dist + /api 反代到本机 agent。
# listen / server_name / ssl 由外层 server 决定，任意机器上这样 include：
#
#   server {
#       listen 443 ssl;
#       server_name example.com;
#       ssl_certificate     ...;
#       ssl_certificate_key ...;
#       include /path/to/search-agent.conf;
#   }
#
# 适合独占一个 server。若与其它站点共用同一 server，location / 会冲突。
#
# 静态根目录约定: /var/www/search-agent/current
#   sudo mkdir -p /var/www/search-agent/releases
#   sudo ln -sfn /var/www/search-agent/releases/<sha> /var/www/search-agent/current
#
# agent 建议只绑本机: compose ports 写成 "127.0.0.1:8787:8787"。
# proxy_pass 不要带尾斜杠，否则会剥掉 /api 前缀。

root /CHANGE/THE/PATH;
index index.html;
charset utf-8;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

location / {
    try_files $uri $uri/ /index.html;
}

# 搜索 SSE 可能跑数分钟；关掉缓冲，否则进度会卡在 nginx
location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
