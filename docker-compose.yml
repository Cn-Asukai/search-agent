# ════════════════════════════════════════════════════════════════
# search-agent 容器编排:仅从远程拉取镜像并部署,不在本地构建。
#   agent     → ghcr.io/cn-asukai/search-agent          (linux/amd64 + linux/arm64)
#   websearch → ghcr.io/daidaij/websearch-mcpserver     (暂钉 linux/amd64,上游发 arm64 后去掉 platform)
#
# 使用:
#   1. cp .env.example .env 并填入 LLM_BASE_URL / LLM_API_KEY / LLM_MODEL
#   2. docker compose pull && docker compose up -d
#   3. 验证: curl http://localhost:8787/health
#
# 数据目录:
#   - opencode-data:agent 容器的 opencode 会话/缓存(~/.local/share/opencode)
#   - websearch-cache:websearch 搜索缓存
# ════════════════════════════════════════════════════════════════

services:
  agent:
    image: ghcr.io/cn-asukai/search-agent:${AGENT_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: search-agent
    restart: unless-stopped
    # 内嵌 opencode 需要联网安装 AI SDK 的 provider 包(仅首次)
    # 如需 http(s) 代理,取消下面两行并指向你的代理(如 Clash 7890/7897)
    # environment:
    #   - HTTP_PROXY=http://host.docker.internal:7897
    #   - HTTPS_PROXY=http://host.docker.internal:7897
    environment:
      # HTTP 服务监听(容器内固定 8787;改对外端口改 ports 即可)
      PORT: 8787
      HOST: 0.0.0.0

      # ── 模型(必填:任意 OpenAI 兼容网关)──────────────────────
      # 不绑定厂商。填 API 根地址、key、发给上游的模型名即可。
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # 一般不用改;自定义网关固定走 opencode 的 custom/default
      OPENCODE_MODEL: ${OPENCODE_MODEL:-custom/default}

      # ── 任务执行(可选)────────────────────────────────────────
      # TASK_TIMEOUT_MS: 300000
      # MAX_CONCURRENCY: 3
      # SYNC_MAX_WAIT_MS: 1800000

      # ── API 鉴权(可选)────────────────────────────────────────
      # API_AUTH_KEY: ${API_AUTH_KEY:-}
    ports:
      - "${AGENT_PORT:-8787}:8787"
    volumes:
      # opencode 会话/缓存(服务重启不清空;便于回看检索 session)
      - opencode-data:/home/node/.local/share/opencode
    depends_on:
      websearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 联网搜索 MCP 服务(远程镜像,不在本仓库构建)──────────────
  websearch:
    image: ghcr.io/daidaij/websearch-mcpserver:${WEBSEARCH_IMAGE_TAG:-latest}
    # 上游镜像暂无 linux/arm64;钉 amd64,由 Docker Desktop / QEMU 模拟。
    # 上游发布 arm64 清单后删掉本行。
    platform: linux/amd64
    pull_policy: always
    container_name: search-websearch
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 若需开启业务端点鉴权,在 .env 设置 WEBSEARCH_TOKEN,
      # 并同步取消镜像内 opencode.jsonc 中 headers 注释(需重建 agent 镜像)
      # WEBSEARCH_TOKEN: ${WEBSEARCH_TOKEN:-}
    ports:
      # 仅供本机调试;agent 走 compose 内网 websearch:8338,不依赖此映射
      - "127.0.0.1:${WEBSEARCH_PORT:-8338}:8338"
    volumes:
      # 覆盖镜像内默认 config.yaml（含 baidu.web_enabled: true）
      - ./websearch.config.yaml:/app/config.yaml:ro
      - websearch-cache:/app/data
    healthcheck:
      # 远程镜像基于 alpine(busybox),无 curl;以端口探活代替 MCP 握手
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8338 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  opencode-data:
  websearch-cache:
